<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galeri</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1;  }
        #gallery-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); display: none; z-index: 9999;
            flex-direction: column; justify-content: center; backdrop-filter: blur(15px);
            perspective: 1200px;
            overflow: hidden;
        }
        .swiper { width: 100%; height: 80vh; padding-top: 50px; padding-bottom: 50px; }
        .swiper-slide { 
            width: 80vw;
            height: 60vh;
            display: flex; justify-content: center; align-items: center;
            background: transparent;
        }

        /* --- ŞAŞALI VE ANİMASYONLU KALPLİ ÇERÇEVE STİLLERİ --- */
        .img-frame-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border-radius: 20px;
            background: linear-gradient(45deg, #ff0055, #ff758c, #ff2a6d, #ffb6c1, #ff0055);
            background-size: 300% 300%;
            animation: borderShift 4s infinite linear, heartPulse 2.5s infinite ease-in-out;
            max-width: 85%;
            max-height: 85%;
            z-index: 2;
        }

        .swiper-slide img { 
            display: block; 
            max-width: 100%; 
            max-height: 55vh;
            width: auto;
            height: auto;
            object-fit: contain; 
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        @keyframes borderShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes heartPulse {
            0% { box-shadow: 0 0 25px #ff0055, 0 0 50px rgba(255, 0, 85, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 45px #ff2a6d, 0 0 80px rgba(255, 42, 109, 0.9); transform: scale(1.02); }
            100% { box-shadow: 0 0 25px #ff0055, 0 0 50px rgba(255, 0, 85, 0.6); transform: scale(1); }
        }

        .corner-heart {
            position: absolute;
            font-size: 28px;
            z-index: 10;
            animation: heartFloat 1.8s infinite alternate ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.8));
        }
        .top-left { top: -16px; left: -16px; }
        .top-right { top: -16px; right: -16px; animation-delay: 0.4s; }
        .bottom-left { bottom: -16px; left: -16px; animation-delay: 0.8s; }
        .bottom-right { bottom: -16px; right: -16px; animation-delay: 1.2s; }

        @keyframes heartFloat {
            from { transform: translateY(0) scale(1) rotate(-5deg); }
            to { transform: translateY(-8px) scale(1.3) rotate(10deg); }
        }

        /* --- GERÇEKÇİ 3D KELEBEK ANİMASYONU --- */
        .butterfly-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .butterfly {
            position: absolute;
            width: 35px;
            height: 35px;
            transform-style: preserve-3d;
            animation: butterflyFly 14s infinite ease-in-out;
            filter: drop-shadow(0 0 12px rgba(255, 105, 180, 0.9));
        }

        .bf-2 {
            animation: butterflyFly2 18s infinite ease-in-out;
            animation-delay: -5s;
            filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.9));
        }

        .wing {
            position: absolute;
            width: 18px;
            height: 28px;
            border-radius: 50% 50% 20% 80%;
            background: linear-gradient(135deg, rgba(255,182,193,0.95), rgba(255,20,147,0.85));
            box-shadow: inset 0 0 5px rgba(255,255,255,0.8);
            top: 0;
        }

        .wing.left {
            left: 0;
            transform-origin: right center;
            animation: flapLeft 0.35s infinite alternate ease-in-out;
        }

        .wing.right {
            right: 0;
            transform-origin: left center;
            border-radius: 50% 50% 80% 20%;
            animation: flapRight 0.35s infinite alternate ease-in-out;
        }

        .bf-2 .wing {
            background: linear-gradient(135deg, rgba(135,206,250,0.95), rgba(138,43,226,0.85));
        }

        @keyframes flapLeft {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(70deg); }
        }

        @keyframes flapRight {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-70deg); }
        }

        @keyframes butterflyFly {
            0% { top: 80%; left: -10%; transform: scale(0.6) rotate(20deg); }
            25% { top: 30%; left: 35%; transform: scale(0.9) rotate(-15deg); }
            50% { top: 60%; left: 70%; transform: scale(1.1) rotate(25deg); }
            75% { top: 15%; left: 85%; transform: scale(0.8) rotate(-10deg); }
            100% { top: -10%; left: 110%; transform: scale(0.6) rotate(15deg); }
        }

        @keyframes butterflyFly2 {
            0% { top: 20%; left: 110%; transform: scale(0.7) rotate(-30deg); }
            30% { top: 70%; left: 60%; transform: scale(1) rotate(10deg); }
            65% { top: 20%; left: 20%; transform: scale(0.8) rotate(-20deg); }
            100% { top: 90%; left: -10%; transform: scale(0.6) rotate(30deg); }
        }
        /* -------------------------------------- */

        .photo-info { color: #fff; margin-top: 10px; text-align: center; padding: 0 20px; z-index: 2; }
        .photo-info h2 { margin: 0; font-size: 22px; letter-spacing: 1px; }
        .close-btn {
            position: absolute; top: 30px; right: 25px; color: #fff;
            font-size: 45px; cursor: pointer; z-index: 10000;
            width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.15); border-radius: 50%;
        }

        .heart-marker {
            font-size: 45px;
            line-height: 45px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.9));
        }
        .heart-marker:hover {
            transform: scale(1.3) rotate(-10deg);
        }
        .loading { color: white; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }
        
        .emoji-marker-style {
            background: none !important;
            border: none !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="loading">Harita Yükleniyor...</div>
<div id="map"></div>

<div id="gallery-modal">
    <div class="butterfly-container">
        <div class="butterfly bf-1"><div class="wing left"></div><div class="wing right"></div></div>
        <div class="butterfly bf-2"><div class="wing left"></div><div class="wing right"></div></div>
    </div>
    <div class="close-btn" onclick="closeGallery()">&times;</div>
    <div class="swiper">
        <div class="swiper-wrapper" id="slider-content"></div>
        <div class="swiper-pagination"></div>
    </div>
    <div class="photo-info">
        <h2 id="modal-title"></h2>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    var map = L.map('map', { zoomControl: false }).setView([39.0, 35.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    var swiper = new Swiper(".swiper", {
        effect: "coverflow",
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: "auto",
        coverflowEffect: {
            rotate: 45,
            stretch: 10,
            depth: 400,
            modifier: 1.5,
            slideShadows: true,
        },
        pagination: { el: ".swiper-pagination", clickable: true }
    });

    function openGallery(title, images) {
        const wrapper = document.getElementById('slider-content');
        wrapper.innerHTML = ""; 
        images.forEach(url => {
            wrapper.innerHTML += `
                <div class="swiper-slide">
                    <div class="img-frame-wrapper">
                        <span class="corner-heart top-left">💖</span>
                        <span class="corner-heart top-right">✨</span>
                        <span class="corner-heart bottom-left">✨</span>
                        <span class="corner-heart bottom-right">💖</span>
                        <img src="${url}">
                    </div>
                </div>`;
        });
        document.getElementById('modal-title').innerText = title;
        document.getElementById('gallery-modal').style.display = 'flex';
        setTimeout(() => {
            swiper.update();
            swiper.slideTo(Math.floor(images.length / 2), 0);
        }, 150);
    }

    function closeGallery() {
        document.getElementById('gallery-modal').style.display = 'none';
    }

    function aniEkle(lat, lng, baslik, fotoDizisi) {
        var icon = L.divIcon({ 
            className: 'heart-marker', 
            html: '❤️',
            iconSize: [45, 45], 
            iconAnchor: [22, 22] 
        });
        var marker = L.marker([lat, lng], {icon: icon}).addTo(map);
        marker.on('click', function() {
            openGallery(baslik, fotoDizisi);
        });
    }

    aniEkle(38.2885662831978, 26.379525435810383, "Alaçatı", ["1.jpeg", "2.jpeg", "27.jpeg", "26.jpeg", "13.jpeg", "9.jpeg", "21.jpeg"]);
    aniEkle(38.38187719217507, 27.179811387580582, "İzmir", ["8.jpeg", "4.jpeg", "19.jpeg", "23.jpeg", "24.jpeg", "16.jpeg", "12.jpeg", "izm.jpeg", "izm.jpeg"]);
    aniEkle(37.04695187158088, 35.29309820690316, "Adana", ["3.jpeg", "6.jpeg", "25.jpeg", "10.jpeg", "22.jpeg", "15.jpeg", "11.jpeg", "7.jpeg", "14.jpeg", "99.jpg", "adn1.jpeg", "adn2.jpeg"]);
    aniEkle(40.35500812341561, 27.969860090522594, "Bandırma", ["ban1.jpeg", "ban2.jpeg", "ban3.jpeg"]);
    aniEkle(38.32701110724751, 26.29881868376702, "Çeşme", ["csm1.jpeg", "csm2.jpeg", "csm3.jpeg"]);
    aniEkle(40.405790098183346, 27.786388991292114, "Erdek", ["erdek.jpeg", "erdekk.jpeg", "erdekkk.jpeg"]);

    L.marker([36.64312665412601, 34.377776919020896], {
        icon: L.divIcon({
            html: '<div style="font-size: 35px;">⌛</div>',
            className: 'emoji-marker-style',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        })
    }).addTo(map);

    L.marker([39.92488833905181, 32.837078699927964], {
        icon: L.divIcon({
            html: '<div style="font-size: 35px;">⌛</div>',
            className: 'emoji-marker-style',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        })
    }).addTo(map);

    L.marker([40.98772019149093, 29.03688159927305], {
        icon: L.divIcon({
            html: '<div style="font-size: 35px;">⌛</div>',
            className: 'emoji-marker-style',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        })
    }).addTo(map);

    L.marker([37.667559013315525, 36.29054859510243], {
        icon: L.divIcon({
            html: '<div style="font-size: 35px;">⌛</div>',
            className: 'emoji-marker-style',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        })
    }).addTo(map);

    /* Bursa - Yeni eklenen kum saati konumu */
    L.marker([40.18863294735038, 29.060803222609856], {
        icon: L.divIcon({
            html: '<div style="font-size: 35px;">⌛</div>',
            className: 'emoji-marker-style',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        })
    }).addTo(map);
</script>
</body>
</html>
